[package]
name = "grok-bot-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
toml = { version = "0.9", features = ["preserve_order"] }
xai-grok-shell = { git = "https://github.com/xai-org/grok-build.git", rev = "2bdd1d6a6369de0e8c68132ea4539e9abd9e14a8", default-features = false }

[patch.crates-io]
async-openai = { git = "https://github.com/our-forks/async-openai.git", rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "debuginfo"
