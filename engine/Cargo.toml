[package]
name = "grok-bot-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "grok_bot_engine"
path = "src/lib.rs"

[[bin]]
name = "grok-bot-engine"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "=0.10.4", features = ["unstable"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = { version = "0.9", features = ["preserve_order"] }
xai-fsnotify = { git = "https://github.com/xai-org/grok-build.git", rev = "2bdd1d6a6369de0e8c68132ea4539e9abd9e14a8" }
xai-acp-lib = { git = "https://github.com/xai-org/grok-build.git", rev = "2bdd1d6a6369de0e8c68132ea4539e9abd9e14a8" }
xai-grok-shell = { git = "https://github.com/xai-org/grok-build.git", rev = "2bdd1d6a6369de0e8c68132ea4539e9abd9e14a8", default-features = false }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net"] }

[patch.crates-io]
async-openai = { git = "https://github.com/our-forks/async-openai.git", rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "debuginfo"
