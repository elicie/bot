[package]
name = "grok-bot-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:tauri", "dep:tauri-build", "dep:grok-bot-core", "dep:grok-bot-engine"]

[[bin]]
name = "grok-bot-desktop"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
anyhow.workspace = true
dirs = "6"
url = "2"
fs2 = "0.4"
# Only the native composition root needs the engine/core; import/path tests stay standalone.
grok-bot-core = { workspace = true, optional = true }
grok-bot-engine = { workspace = true, optional = true }
grok-bot-files.workspace = true
grok-bot-model.workspace = true
grok-bot-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
libc = "0.2"
tempfile = "3"
rustix = { version = "1", features = ["fs", "std"] }
tauri = { version = "=2.12.5", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }

[dev-dependencies]
tempfile = "3"
