[dependencies]
agent-client-protocol = { version = "=0.10.4", features = ["unstable"] }
anyhow.workspace = true
chrono.workspace = true
getrandom = "0.3"
grok-bot-engine.workspace = true
grok-bot-files.workspace = true
grok-bot-model.workspace = true
