[package]
name = "grok-bot-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol = { version = "=0.10.4", features = ["unstable"] }
anyhow.workspace = true
chrono.workspace = true
getrandom = "0.3"
grok-bot-engine.workspace = true
grok-bot-files.workspace = true
grok-bot-model.workspace = true
grok-bot-store.workspace = true
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tokio = { workspace = true, features = ["process"] }
uuid.workspace = true
axum = "0.8"
# Managed computer: Chrome over a CDP pipe, loopback proxy, URL policy.
base64 = "0.22"
httparse = "1"
libc = "0.2"
tempfile = "3"
url = "2"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
