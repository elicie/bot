[package]
name = "grok-bot-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol = { version = "=0.10.4", features = ["unstable"] }
anyhow.workspace = true
chrono.workspace = true
getrandom = "0.3"
grok-bot-engine.workspace = true
grok-bot-files.workspace = true
grok-bot-model.workspace = true
grok-bot-store.workspace = true
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# MCP's SDK uses reqwest 0.13; keep the existing provider/computer client on 0.12.
reqwest-mcp = { package = "reqwest", version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
sse-stream = "0.2.4"
tracing = "0.1"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
subtle = "2.6"
tokio = { workspace = true, features = ["process"] }
uuid.workspace = true
axum = "0.8"
# Managed computer: Chrome over a CDP pipe, loopback proxy, URL policy.
base64 = "0.22"
httparse = "1"
libc = "0.2"
mime_guess = "2"
percent-encoding = "2"
tempfile = "3"
url = "2"
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
axum = "0.8"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
