[workspace]
resolver = "3"
members = [
    "engine",
    "crates/model",
    "crates/store",
    "crates/files",
    "crates/core",
    "crates/server",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
grok-bot-model = { path = "crates/model" }
grok-bot-store = { path = "crates/store" }
grok-bot-files = { path = "crates/files" }
grok-bot-core = { path = "crates/core" }
grok-bot-engine = { path = "engine" }

[patch.crates-io]
async-openai = { git = "https://github.com/our-forks/async-openai.git", rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
# Keep engine/task panics unwindable; abort would take down the entire HTTP server.
panic = "unwind"
