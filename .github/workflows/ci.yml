name: CI

# PRs and main pushes check only affected crates (including reverse dependents), the web build,
# and changed unit/browser tests. Release-path changes also verify the standalone Rust binary
# outside the checkout without Node on PATH. There is no full-suite run; see docs/ci.md for diagnostics.
# Build jobs use the self-hosted grok-bot runner except for fork PRs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Rust on the self-hosted runner: `rustup toolchain install <ver> --profile minimal -c clippy -c rustfmt`,
  # plus `apt install sccache`, the sccache-grok-bot unit and the grok-bot-ci.slice memory cap (docs/ci.md).
  SELF_HOSTED_RUST: 1.98.0
  # Per-runner target dirs; with the shared sccache (20G) a cleared dir rebuilds quickly.
  SELF_HOSTED_TARGET_CAP_GB: 30

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.detect.outputs.web }}
      rust: ${{ steps.detect.outputs.rust }}
      packages: ${{ steps.detect.outputs.packages }}
      unit: ${{ steps.detect.outputs.unit }}
      specs: ${{ steps.detect.outputs.specs }}
      release: ${{ steps.detect.outputs.release }}
      tools: ${{ steps.detect.outputs.tools }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test CI selection
        run: node --test scripts/ci-changes.test.mjs
      - id: detect
        shell: bash # Explicit bash enables pipefail so selector failures cannot hide behind tee.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Missing/zero base (e.g. first push): check the last commit, never the full suite.
          { [ -n "$BASE" ] && git diff --name-only "$BASE"...HEAD > changed.txt; } || git diff --name-only HEAD~1 HEAD > changed.txt
          cat changed.txt
          node scripts/ci-changes.mjs < changed.txt | tee -a "$GITHUB_OUTPUT"

  ci-tools:
    name: CI diagnostic regressions
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/ci-run.test.mjs

  web:
    name: Web (typecheck, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # Same-repo PRs and pushes use the self-hosted ai-dev runner (warm build cache); fork PRs
    # (which need maintainer approval to run at all) use a GitHub-hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # ~/.npm persists on the self-hosted runner; uploading it to the Actions cache only costs time.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: node scripts/ci-run.mjs npm ci
      - run: node scripts/ci-run.mjs npm run build

  lint:
    name: Rust lint (fmt, clippy on affected crates)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Same-repo PRs and pushes use the self-hosted ai-dev runner (warm build cache); fork PRs
    # (which need maintainer approval to run at all) use a GitHub-hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The self-hosted runner uses its pinned toolchain (SELF_HOSTED_RUST); don't touch its rustup.
      - if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo target dir (persistent on self-hosted)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # One target dir per runner so parallel jobs don't wait on each other's cargo lock.
            dir="$HOME/.cache/grok-bot-ci/$RUNNER_NAME/target"
            # Each dir grows with every branch built; clear it past the cap (next build is cold).
            real=$(readlink -f "$dir" || true)
            if [ -d "$real" ] && [ "$(du -s --block-size=1G "$real" | cut -f1)" -gt "$SELF_HOSTED_TARGET_CAP_GB" ]; then
              echo "Clearing $real (over ${SELF_HOSTED_TARGET_CAP_GB}G)"; rm -rf "$real"; rm -f "$dir"
            fi
            # A pinned toolchain installed on the runner, so its default `stable` (shared with other repos) stays untouched.
            echo "RUSTUP_TOOLCHAIN=$SELF_HOSTED_RUST" >> "$GITHUB_ENV"
            # Compiler cache shared by both runners (systemd unit sccache-grok-bot, port 4231), so a new or
            # cleared per-runner target dir reuses dependency builds. It runs outside the job: a job-started
            # server would be killed by the runner's orphan cleanup mid-way through the other runner's build.
            if systemctl is-active --quiet sccache-grok-bot; then
              { echo "RUSTC_WRAPPER=sccache"; echo "SCCACHE_SERVER_PORT=4231"; } >> "$GITHUB_ENV"
            fi
          else
            dir="$GITHUB_WORKSPACE/target"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci-run.mjs cargo fmt --all --check
      - name: Free disk space
        if: needs.changes.outputs.packages != '' && runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - if: needs.changes.outputs.packages != '' && runner.environment == 'github-hosted'
        id: rust-cache
        uses: Swatinem/rust-cache@v2
      - name: Rust cache status
        if: needs.changes.outputs.packages != ''
        env:
          EXACT_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            echo "Rust lint uses persistent target: $CARGO_TARGET_DIR (no Actions cache upload)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Rust lint cache exact match = $EXACT_HIT (see restore/save logs for fallback hits and uploads)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install ripgrep (bundled into the Rust server)
        if: needs.changes.outputs.packages != '' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # scripts/cargo.mjs stages a checksum-verified protoc and sets the ripgrep paths.
      - name: Clippy
        if: needs.changes.outputs.packages != ''
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: node scripts/ci-run.mjs node scripts/cargo.mjs clippy --locked $PACKAGES --all-targets -- -D warnings
      - name: Final disk usage
        if: always()
        run: |
          df -h / . /tmp && df -i / . /tmp && du -sh -- "${CARGO_TARGET_DIR:-target}" 2>/dev/null || true
          if [ -n "${RUSTC_WRAPPER:-}" ]; then sccache --show-stats 2>/dev/null | grep -E '^(Compile requests|Cache (hits|misses)|Cache size|Max cache size)' || true; fi

  test:
    name: Tests (affected crates, frontend units, Rust specs)
    needs: changes
    if: needs.changes.outputs.packages != '' || needs.changes.outputs.unit != '' || needs.changes.outputs.specs != ''
    # Same-repo PRs and pushes use the pinned, persistent self-hosted build environment.
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 120
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
      UNIT_TESTS: ${{ needs.changes.outputs.unit }}
      SPECS: ${{ needs.changes.outputs.specs }}
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v4
      # One persistent target dir for the Rust workspace and browser fixture.
      - name: Cargo target dir (persistent on self-hosted)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # One target dir per runner so parallel jobs don't wait on each other's cargo lock.
            dir="$HOME/.cache/grok-bot-ci/$RUNNER_NAME/target"
            # Each dir grows with every branch built; clear it past the cap (next build is cold).
            real=$(readlink -f "$dir" || true)
            if [ -d "$real" ] && [ "$(du -s --block-size=1G "$real" | cut -f1)" -gt "$SELF_HOSTED_TARGET_CAP_GB" ]; then
              echo "Clearing $real (over ${SELF_HOSTED_TARGET_CAP_GB}G)"; rm -rf "$real"; rm -f "$dir"
            fi
            # A pinned toolchain installed on the runner, so its default `stable` (shared with other repos) stays untouched.
            echo "RUSTUP_TOOLCHAIN=$SELF_HOSTED_RUST" >> "$GITHUB_ENV"
            # Compiler cache shared by both runners (systemd unit sccache-grok-bot, port 4231), so a new or
            # cleared per-runner target dir reuses dependency builds. It runs outside the job: a job-started
            # server would be killed by the runner's orphan cleanup mid-way through the other runner's build.
            if systemctl is-active --quiet sccache-grok-bot; then
              { echo "RUSTC_WRAPPER=sccache"; echo "SCCACHE_SERVER_PORT=4231"; } >> "$GITHUB_ENV"
            fi
          else
            dir="$GITHUB_WORKSPACE/target"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.environment == 'github-hosted'
        id: rust-cache
        uses: Swatinem/rust-cache@v2
      - name: Rust cache status
        env:
          EXACT_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            echo "Rust test uses persistent target: $CARGO_TARGET_DIR (no Actions cache upload)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Rust test cache exact match = $EXACT_HIT (see restore/save logs for fallback hits and uploads)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # ~/.npm persists on the self-hosted runner; uploading it to the Actions cache only costs time.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - name: Install ripgrep (bundled into the Rust server)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: node scripts/ci-run.mjs npm ci
      - name: Rust tests (affected crates)
        if: env.PACKAGES != ''
        run: node scripts/ci-run.mjs node scripts/cargo.mjs test --locked $PACKAGES
      - name: Unit tests (changed files)
        if: env.UNIT_TESTS != ''
        timeout-minutes: 30
        run: |
          # Clip pathological lines: a multi-megabyte line (e.g. a failure message dumping a 64 MiB test
          # state) stalls the runner's log processing for hours instead of failing the step (#13).
          set -o pipefail
          node scripts/ci-run.mjs npx tsx --test --test-timeout=180000 --test-reporter=spec $UNIT_TESTS 2>&1 | node scripts/clip-lines.mjs
      - name: Build web and Rust server for end-to-end specs
        if: env.SPECS != ''
        run: |
          node scripts/ci-run.mjs npm run build
          node scripts/ci-run.mjs npm run build:server
      - name: End-to-end specs (changed, Rust server, system Chrome)
        if: env.SPECS != ''
        timeout-minutes: 30
        env:
          GROK_BOT_SERVER_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/grok-bot
        run: node scripts/ci-run.mjs npx playwright test $SPECS
      - name: Final disk usage
        if: always()
        run: |
          df -h / . /tmp && df -i / . /tmp && du -sh -- "${CARGO_TARGET_DIR:-target}" 2>/dev/null || true
          if [ -n "${RUSTC_WRAPPER:-}" ]; then sccache --show-stats 2>/dev/null | grep -E '^(Compile requests|Cache (hits|misses)|Cache size|Max cache size)' || true; fi
      - name: Upload Playwright results
        if: failure() && env.SPECS != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/grok-bot-playwright-results
          retention-days: 7

  release:
    name: Standalone Rust release
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 120
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v4
      - name: Cargo target dir (persistent on self-hosted)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # Match the existing per-runner cache and cap policy used by lint/test.
            dir="$HOME/.cache/grok-bot-ci/$RUNNER_NAME/target"
            real=$(readlink -f "$dir" || true)
            if [ -d "$real" ] && [ "$(du -s --block-size=1G "$real" | cut -f1)" -gt "$SELF_HOSTED_TARGET_CAP_GB" ]; then
              echo "Clearing $real (over ${SELF_HOSTED_TARGET_CAP_GB}G)"; rm -rf "$real"; rm -f "$dir"
            fi
            echo "RUSTUP_TOOLCHAIN=$SELF_HOSTED_RUST" >> "$GITHUB_ENV"
            # Compiler cache shared by both runners (systemd unit sccache-grok-bot, port 4231), so a new or
            # cleared per-runner target dir reuses dependency builds. It runs outside the job: a job-started
            # server would be killed by the runner's orphan cleanup mid-way through the other runner's build.
            if systemctl is-active --quiet sccache-grok-bot; then
              { echo "RUSTC_WRAPPER=sccache"; echo "SCCACHE_SERVER_PORT=4231"; } >> "$GITHUB_ENV"
            fi
          else
            dir="$GITHUB_WORKSPACE/target"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.environment == 'github-hosted'
        id: rust-cache
        uses: Swatinem/rust-cache@v2
      - name: Rust cache status
        env:
          EXACT_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            echo "Rust release uses persistent target: $CARGO_TARGET_DIR (no Actions cache upload)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Rust release cache exact match = $EXACT_HIT (see restore/save logs for fallback hits and uploads)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - name: Install ripgrep (bundled into the Rust server)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: node scripts/ci-run.mjs npm ci
      - name: Build standalone release with embedded frontend
        run: node scripts/ci-run.mjs npm run build:release
      - name: Verify release outside the checkout without Node
        run: node scripts/ci-run.mjs node scripts/verify-release.mjs "$CARGO_TARGET_DIR/release/grok-bot"
      - name: Final disk usage
        if: always()
        run: |
          df -h / . /tmp && df -i / . /tmp && du -sh -- "${CARGO_TARGET_DIR:-target}" 2>/dev/null || true
          if [ -n "${RUSTC_WRAPPER:-}" ]; then sccache --show-stats 2>/dev/null | grep -E '^(Compile requests|Cache (hits|misses)|Cache size|Max cache size)' || true; fi
