name: CI

# Checks only what a change touches (scripts/ci-changes.mjs): the web build for UI changes,
# rustfmt plus clippy/tests of the changed crates, the changed Node tests, and only the
# Playwright specs that changed. There is no full-suite run.
# Build jobs run on the self-hosted ai-dev runner (label grok-bot) except for fork PRs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Rust on the self-hosted runner: `rustup toolchain install <ver> --profile minimal -c clippy -c rustfmt`.
  SELF_HOSTED_RUST: 1.98.0
  SELF_HOSTED_TARGET_CAP_GB: 40

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.detect.outputs.web }}
      rust: ${{ steps.detect.outputs.rust }}
      packages: ${{ steps.detect.outputs.packages }}
      node: ${{ steps.detect.outputs.node }}
      specs: ${{ steps.detect.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --name-only "$BASE"...HEAD > changed.txt 2>/dev/null || git diff --name-only HEAD~1 HEAD > changed.txt
          cat changed.txt
          node scripts/ci-changes.mjs < changed.txt | tee -a "$GITHUB_OUTPUT"

  web:
    name: Web (typecheck, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # Same-repo PRs and pushes use the self-hosted ai-dev runner (warm build cache); fork PRs
    # (which need maintainer approval to run at all) use a GitHub-hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # ~/.npm persists on the self-hosted runner; uploading it to the Actions cache only costs time.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: npm ci
      - run: npm run build

  lint:
    name: Rust lint (fmt, clippy on changed crates)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Same-repo PRs and pushes use the self-hosted ai-dev runner (warm build cache); fork PRs
    # (which need maintainer approval to run at all) use a GitHub-hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The self-hosted runner uses its pinned toolchain (SELF_HOSTED_RUST); don't touch its rustup.
      - if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo target dir (persistent on self-hosted)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # One target dir per runner so parallel jobs don't wait on each other's cargo lock.
            dir="$HOME/.cache/grok-bot-ci/$RUNNER_NAME/target"
            # Each dir grows with every branch built; clear it past the cap (next build is cold).
            real=$(readlink -f "$dir" || true)
            if [ -d "$real" ] && [ "$(du -s --block-size=1G "$real" | cut -f1)" -gt "$SELF_HOSTED_TARGET_CAP_GB" ]; then
              echo "Clearing $real (over ${SELF_HOSTED_TARGET_CAP_GB}G)"; rm -rf "$real"; rm -f "$dir"
            fi
            # A pinned toolchain installed on the runner, so its default `stable` (shared with other repos) stays untouched.
            echo "RUSTUP_TOOLCHAIN=$SELF_HOSTED_RUST" >> "$GITHUB_ENV"
          else
            dir="$GITHUB_WORKSPACE/target"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - name: Free disk space
        if: needs.changes.outputs.packages != '' && runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - if: needs.changes.outputs.packages != '' && runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.packages != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ripgrep (bundled into the engine build)
        if: needs.changes.outputs.packages != '' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # scripts/cargo.mjs stages a checksum-verified protoc and sets the ripgrep paths.
      - name: Clippy
        if: needs.changes.outputs.packages != ''
        run: node scripts/cargo.mjs clippy --locked ${{ needs.changes.outputs.packages }} --all-targets -- -D warnings

  test:
    name: Tests (changed crates, Node tests, specs)
    needs: changes
    if: needs.changes.outputs.packages != '' || needs.changes.outputs.node != '' || needs.changes.outputs.specs != ''
    # Same-repo PRs and pushes use the self-hosted ai-dev runner (warm build cache); fork PRs
    # (which need maintainer approval to run at all) use a GitHub-hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 120
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
      NODE_TESTS: ${{ needs.changes.outputs.node }}
      SPECS: ${{ needs.changes.outputs.specs }}
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v4
      # One target dir for cargo, scripts/build-engine.mjs (defaults to engine/target), and rust-cache.
      - name: Cargo target dir (persistent on self-hosted)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # One target dir per runner so parallel jobs don't wait on each other's cargo lock.
            dir="$HOME/.cache/grok-bot-ci/$RUNNER_NAME/target"
            # Each dir grows with every branch built; clear it past the cap (next build is cold).
            real=$(readlink -f "$dir" || true)
            if [ -d "$real" ] && [ "$(du -s --block-size=1G "$real" | cut -f1)" -gt "$SELF_HOSTED_TARGET_CAP_GB" ]; then
              echo "Clearing $real (over ${SELF_HOSTED_TARGET_CAP_GB}G)"; rm -rf "$real"; rm -f "$dir"
            fi
            # A pinned toolchain installed on the runner, so its default `stable` (shared with other repos) stays untouched.
            echo "RUSTUP_TOOLCHAIN=$SELF_HOSTED_RUST" >> "$GITHUB_ENV"
          else
            dir="$GITHUB_WORKSPACE/target"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # ~/.npm persists on the self-hosted runner; uploading it to the Actions cache only costs time.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - name: Install ripgrep (bundled into the engine build)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - name: Rust tests (changed crates)
        if: env.PACKAGES != ''
        run: node scripts/cargo.mjs test --locked $PACKAGES
      # The Node backend tests drive the real engine binary.
      - name: Node tests (changed)
        if: env.NODE_TESTS != ''
        timeout-minutes: 30
        run: |
          npm run build:engine
          if [ "$NODE_TESTS" = all ]; then files="tests/*.test.ts"; else files="$NODE_TESTS"; fi
          npx tsx --test --test-timeout=180000 --test-reporter=spec $files
      - name: End-to-end specs (changed, Rust backend, system Chrome)
        if: env.SPECS != ''
        env:
          GROK_BOT_BACKEND: rust
          GROK_BOT_SERVER_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/grok-bot
        run: |
          npm run build
          npm run build:server
          npx playwright test $SPECS
      - name: Disk usage
        if: always()
        run: df -h / && du -sh "$CARGO_TARGET_DIR" 2>/dev/null || true
      - name: Upload Playwright results
        if: failure() && env.SPECS != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/grok-bot-playwright-results
          retention-days: 7
