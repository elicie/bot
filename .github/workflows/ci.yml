name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # Lints run on their own runner: clippy's artifacts and the test build together do not fit the
  # default runner disk next to the pinned Grok Build engine source build.
  lint:
    name: Rust lint (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ripgrep (bundled into the engine build)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # scripts/cargo.mjs stages a checksum-verified protoc and sets the ripgrep paths.
      - run: node scripts/cargo.mjs clippy --locked --workspace --all-targets -- -D warnings
      - name: Disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  test:
    name: Tests (Rust, Node, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # One target dir for cargo, scripts/build-engine.mjs (defaults to engine/target), and rust-cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install ripgrep (bundled into the engine build)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:rust
      - name: Disk usage after Rust tests
        run: df -h / && du -sh target
      # The Node backend tests drive the real engine binary; it reuses the workspace build above.
      - run: npm run build:engine
      # Per-test timeout so a hang names the test instead of stalling the job.
      - name: Node tests
        run: npx tsx --test --test-timeout=180000 --test-reporter=spec tests/*.test.ts
        timeout-minutes: 20
      - run: npm run build
      - run: npm run build:server
      - name: End-to-end tests (Rust backend, system Chrome)
        run: npx playwright test
        env:
          GROK_BOT_BACKEND: rust
          GROK_BOT_SERVER_BIN: ${{ github.workspace }}/target/debug/grok-bot
      - name: Disk usage
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/grok-bot-playwright-results
          retention-days: 7
