name: CI

# PRs check affected crates (including reverse dependents) and changed JS/browser tests.
# Daily and manual runs cover the full suite; see docs/ci.md for scope and diagnostics.
# Build jobs use the self-hosted grok-bot runner except for fork PRs.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # Daily at 03:17 UTC on the default branch (main).
  workflow_dispatch:

concurrency:
  # A main push must not cancel the daily full check.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Rust on the self-hosted runner: `rustup toolchain install <ver> --profile minimal -c clippy -c rustfmt`.
  SELF_HOSTED_RUST: 1.98.0

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.detect.outputs.web }}
      rust: ${{ steps.detect.outputs.rust }}
      packages: ${{ steps.detect.outputs.packages }}
      node: ${{ steps.detect.outputs.node }}
      specs: ${{ steps.detect.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test CI selection and diagnostics
        run: node --test scripts/ci-*.test.mjs
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL" = true ]; then
            node scripts/ci-changes.mjs --full | tee -a "$GITHUB_OUTPUT"
          else
            # Missing/zero base (e.g. first push): check the last commit, never the full suite.
            { [ -n "$BASE" ] && git diff --name-only "$BASE"...HEAD > changed.txt; } || git diff --name-only HEAD~1 HEAD > changed.txt
            cat changed.txt
            node scripts/ci-changes.mjs < changed.txt | tee -a "$GITHUB_OUTPUT"
          fi

  web:
    name: Web (typecheck, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # Same-repo PRs and pushes use the self-hosted ai-dev runner (warm build cache); fork PRs
    # (which need maintainer approval to run at all) use a GitHub-hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # ~/.npm persists on the self-hosted runner; uploading it to the Actions cache only costs time.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: node scripts/ci-run.mjs npm ci
      - run: node scripts/ci-run.mjs npm run build

  lint:
    name: Rust lint (fmt, clippy on affected crates)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Same-repo PRs and pushes use the self-hosted ai-dev runner (warm build cache); fork PRs
    # (which need maintainer approval to run at all) use a GitHub-hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The self-hosted runner uses its pinned toolchain (SELF_HOSTED_RUST); don't touch its rustup.
      - if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo target dir (persistent on self-hosted)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            dir="$HOME/.cache/grok-bot-ci/target"
            # A pinned toolchain installed on the runner, so its default `stable` (shared with other repos) stays untouched.
            echo "RUSTUP_TOOLCHAIN=$SELF_HOSTED_RUST" >> "$GITHUB_ENV"
          else
            dir="$GITHUB_WORKSPACE/target"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci-run.mjs cargo fmt --all --check
      - name: Free disk space
        if: needs.changes.outputs.packages != '' && runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - if: needs.changes.outputs.packages != '' && runner.environment == 'github-hosted'
        id: rust-cache
        uses: Swatinem/rust-cache@v2
      - name: Rust cache status
        if: needs.changes.outputs.packages != ''
        env:
          EXACT_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: echo "Rust lint cache exact match = $EXACT_HIT (see restore/save logs for fallback hits and uploads)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install ripgrep (bundled into the engine build)
        if: needs.changes.outputs.packages != '' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # scripts/cargo.mjs stages a checksum-verified protoc and sets the ripgrep paths.
      - name: Clippy
        if: needs.changes.outputs.packages != ''
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: node scripts/ci-run.mjs node scripts/cargo.mjs clippy --locked $PACKAGES --all-targets -- -D warnings
      - name: Final disk usage
        if: always()
        run: df -h / && df -i / && du -sh target 2>/dev/null || true

  test:
    name: Tests (affected crates, Node tests, specs)
    needs: changes
    if: needs.changes.outputs.packages != '' || needs.changes.outputs.node != '' || needs.changes.outputs.specs != ''
    # Same-repo PRs and pushes use the self-hosted ai-dev runner (warm build cache); fork PRs
    # (which need maintainer approval to run at all) use a GitHub-hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "grok-bot"]') }}
    timeout-minutes: 120
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
      NODE_TESTS: ${{ needs.changes.outputs.node }}
      SPECS: ${{ needs.changes.outputs.specs }}
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v4
      # One target dir for cargo, scripts/build-engine.mjs (defaults to engine/target), and rust-cache.
      - name: Cargo target dir (persistent on self-hosted)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            dir="$HOME/.cache/grok-bot-ci/target"
            # A pinned toolchain installed on the runner, so its default `stable` (shared with other repos) stays untouched.
            echo "RUSTUP_TOOLCHAIN=$SELF_HOSTED_RUST" >> "$GITHUB_ENV"
          else
            dir="$GITHUB_WORKSPACE/target"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - if: runner.environment == 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
      - if: runner.environment == 'github-hosted'
        id: rust-cache
        uses: Swatinem/rust-cache@v2
      - name: Rust cache status
        env:
          EXACT_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: echo "Rust test cache exact match = $EXACT_HIT (see restore/save logs for fallback hits and uploads)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # ~/.npm persists on the self-hosted runner; uploading it to the Actions cache only costs time.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - name: Install ripgrep (bundled into the engine build)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: node scripts/ci-run.mjs npm ci
      - name: Rust tests (affected crates)
        if: env.PACKAGES != ''
        run: node scripts/ci-run.mjs node scripts/cargo.mjs test --locked $PACKAGES
      # Keep compilation separate so a stall cannot be mistaken for a silent Node test.
      - name: Build engine for Node tests
        if: env.NODE_TESTS != ''
        timeout-minutes: 30
        run: node scripts/ci-run.mjs npm run build:engine
      - name: Node tests (selected or full)
        if: env.NODE_TESTS != ''
        timeout-minutes: 30
        run: |
          if [ "$NODE_TESTS" = all ]; then files="tests/*.test.ts"; else files="$NODE_TESTS"; fi
          node scripts/ci-run.mjs npx tsx --test --test-timeout=180000 --test-reporter=spec $files
      - name: Build web and Rust server for end-to-end specs
        if: env.SPECS != ''
        run: |
          node scripts/ci-run.mjs npm run build
          node scripts/ci-run.mjs npm run build:server
      - name: End-to-end specs (selected or full, Rust backend, system Chrome)
        if: env.SPECS != ''
        timeout-minutes: 30
        env:
          GROK_BOT_BACKEND: rust
          GROK_BOT_SERVER_BIN: ${{ env.CARGO_TARGET_DIR }}/debug/grok-bot
        run: |
          if [ "$SPECS" = all ]; then
            node scripts/ci-run.mjs npx playwright test
          else
            node scripts/ci-run.mjs npx playwright test $SPECS
          fi
      - name: Final disk usage
        if: always()
        run: df -h / . /tmp && df -i / . /tmp && du -sh -- "${CARGO_TARGET_DIR:-target}" 2>/dev/null || true
      - name: Upload Playwright results
        if: failure() && env.SPECS != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/grok-bot-playwright-results
          retention-days: 7
