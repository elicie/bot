name: Service operations

on:
  pull_request:
    paths:
      - 'scripts/service*.mjs'
      - 'deploy/systemd/**'
      - '.github/workflows/service-operations.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/service*.mjs'
      - 'deploy/systemd/**'
      - '.github/workflows/service-operations.yml'

permissions:
  contents: read

jobs:
  service:
    name: Deployment and recovery tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Uses only Node built-ins, isolated temporary directories and fake systemctl/build commands.
      - run: node --test scripts/service.test.mjs
